# Cấu hình cụm — CÁCH B: mỗi máy chạy MỘT node (demo LAN). Cả 5 máy dùng CHUNG file này.
#
#   Máy chạy N2:   python -m dstock.node --id N2 --config cluster.lan.toml
#   Máy client:    python -m dstock.gui --config cluster.lan.toml
#
# Trước khi demo: đổi host thành IP thật (ipconfig), mở firewall Windows cho cổng của node
# chỉ trong mạng riêng của nhóm (xem docs/operations.md), rồi `python -m dstock.cli --config cluster.lan.toml status`
# phải thấy đủ 4 node.
#
#   Client ⇄ N1 ──sync (tức thời)──▶ N2 ──count (sau n lần)──▶ N4
#             └──interval (sau n giây)──▶ N3
#

primary = "N1"
data_dir = "data"            # mỗi node ghi vào data/<id>/
snapshot_every = 50          # tạo checkpoint sau mỗi n entry (chưa dùng)

[nodes.N1]
host = "192.168.1.11"
port = 7001

[nodes.N2]
host = "192.168.1.12"
port = 7002

[nodes.N3]
host = "192.168.1.13"
port = 7003

[nodes.N4]
host = "192.168.1.14"
port = 7004

# param: interval = n giây, count = n lần. Kênh sync đẩy ngay, không chờ xác nhận, nên không có param.
[[links]]
from = "N1"
to = "N2"
mode = "sync"

[[links]]
from = "N1"
to = "N3"
mode = "interval"
param = 5

[[links]]
from = "N2"
to = "N4"
mode = "count"
param = 3

# Nguồn để node kéo dữ liệu khi PHỤC HỒI (recovery.py) — đi THEO CHIỀU CẠNH của sơ đồ đề:
#   N2, N3 kéo từ N1; N4 CHỈ kéo từ N2 (đề: s4 chỉ nhận dữ liệu từ s2).
#   Riêng bản chính N1 kéo từ bản sao có last_lsn LỚN NHẤT (1->2 không chờ xác nhận nên N2 có
#   thể thiếu so với N3). Chọn nguồn OK có last_lsn lớn nhất; hòa thì theo thứ tự danh sách.
[recovery_sources]
N1 = ["N2", "N3", "N4"]
N2 = ["N1"]
N3 = ["N1"]
N4 = ["N2"]
